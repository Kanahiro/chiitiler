[package]
name = "ml2drender-napi"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
ml2drender = { path = "../core" }
napi = { version = "3.16.2", default-features = false, features = ["napi8"] }
napi-derive = "3.7.1"

[build-dependencies]
napi-build = "2.6.0"
