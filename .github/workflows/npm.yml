name: Publish Package to npmjs
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Publication channel (latest is for stable versions only)'
        type: choice
        options: [next, latest]
        default: next
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - id: config
        run: node scripts/release-config.mjs
      - run: npm ci
      - run: npx tsc
      - name: Publish to the selected channel
        env:
          NPM_TAG: ${{ steps.config.outputs.npm_tag }}
        run: npm publish --tag "$NPM_TAG"
