name: Build and Deploy
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Publication channel (latest is for stable versions only)'
        type: choice
        options: [next, latest]
        default: next
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kanahiro/chiitiler

jobs:
  release-config:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.config.outputs.image_tag }}
      publish_latest: ${{ steps.config.outputs.publish_latest }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: config
        run: node scripts/release-config.mjs

  build:
    needs: release-config
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build each platform natively; Node segfaults under QEMU emulation.
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Login GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [build, release-config]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE_TAG: ${{ needs.release-config.outputs.image_tag }}
          PUBLISH_LATEST: ${{ needs.release-config.outputs.publish_latest }}
        run: |
          tags=(-t "$IMAGE:$IMAGE_TAG")
          if [ "$PUBLISH_LATEST" = true ]; then
            tags+=(-t "$IMAGE:latest")
          fi
          digests=()
          for digest in *; do
            digests+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"
          docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG"
