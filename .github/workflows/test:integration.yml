name: test:integration

on:
    pull_request:
        branches:
            - main
        paths:
            - "src/**"
            - "tests/**"
            - "Dockerfile"
            - "docker/**"
            - "docker-compose.yml"
            - "package.json"
            - "package-lock.json"
            - ".github/workflows/test:integration.yml"
    workflow_dispatch:

jobs:
    integrationtest:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
            - name: start server
              run: docker compose up -d
            - name: install dependencies
              run: npm install
            # the app container installs dependencies at startup, so listening
            # begins well after `docker compose up -d` returns
            - name: wait for server
              run: |
                  timeout 300 bash -c 'until curl -sf http://localhost:3000/health > /dev/null; do sleep 2; done' \
                    || { docker compose logs app; exit 1; }
            - name: run test
              run: npm run test:integration

    runtime-smoke:
        strategy:
            fail-fast: false
            matrix:
                runner: [ubuntu-24.04, ubuntu-24.04-arm]
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6
            - uses: docker/setup-buildx-action@v3
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  load: true
                  tags: chiitiler:egl
                  cache-from: type=gha,scope=runtime-${{ matrix.runner }}
                  cache-to: type=gha,mode=max,scope=runtime-${{ matrix.runner }}
            - name: Render with the production runtime filesystem
              run: |
                  docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=64m \
                    --cpus=1 --memory=1024m \
                    -v "$PWD/tests/docker-egl.mjs:/app/docker-egl.mjs:ro" \
                    chiitiler:egl node /app/docker-egl.mjs
