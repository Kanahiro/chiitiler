name: test:integration

on:
    pull_request:
        branches:
            - main
        paths:
            - "src/**"
            - "crates/**"
            - "Cargo.lock"
            - "tests/**"
            - "Dockerfile"
            - "docker-compose.yml"
            - "package.json"
            - "pnpm-lock.yaml"
            - ".github/workflows/test:integration.yml"
    workflow_dispatch:

jobs:
    integrationtest:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
            - name: start server
              run: docker compose up -d
            - name: install dependencies
              run: pnpm install --frozen-lockfile
            # the app container installs dependencies at startup, so listening
            # begins well after `docker compose up -d` returns
            - name: wait for server
              run: |
                  timeout 300 bash -c 'until curl -sf http://localhost:3000/health > /dev/null; do sleep 2; done' \
                    || { docker compose logs app; exit 1; }
            - name: run test
              run: pnpm test:integration
            # The image releases ship (container.yml): the bundle and the addon, no node_modules.
            - name: build and run the release image
              run: |
                  docker build --target runtime -t chiitiler:release .
                  docker run -d --name release -p 3100:3000 chiitiler:release
                  timeout 60 bash -c 'until curl -sf http://localhost:3100/health > /dev/null; do sleep 1; done' \
                    || { docker logs release; exit 1; }
                  curl -sf -o tile.png -X POST -H 'Content-Type: application/json' \
                    -d '{"style":{"version":8,"sources":{},"layers":[{"id":"bg","type":"background","paint":{"background-color":"#ff0000"}}]}}' \
                    http://localhost:3100/tiles/0/0/0.png
                  file tile.png | tee /dev/stderr | grep -q 'PNG image data, 512 x 512'
            - name: dump server logs
              if: failure()
              run: docker compose logs
