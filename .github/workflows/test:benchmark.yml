name: test:benchmark

on:
    pull_request:
        branches:
            - main
        paths:
            - "src/**"
            - "crates/**"
            - "Cargo.lock"
            - "tests/**"
            - "localdata/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - ".github/workflows/test:benchmark.yml"
    workflow_dispatch:
        inputs:
            aa:
                description: "Compare the selected commit with itself to measure noise"
                type: boolean
                default: true

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    benchmark:
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: pnpm
            # Only for baselines that still render with maplibre-gl-native
            - name: Install native deps for maplibre-gl-native
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      xvfb \
                      libcurl4-openssl-dev \
                      libglfw3-dev \
                      libuv1-dev \
                      libjpeg-turbo8-dev \
                      libpng-dev \
                      libwebp-dev
            - name: Install harness dependencies
              run: pnpm install --frozen-lockfile

            - name: Prepare fixed comparison checkouts
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  CURRENT_SHA: ${{ github.sha }}
                  AA: ${{ inputs.aa }}
              run: |
                  base="${BASE_SHA:-$(git rev-parse origin/main)}"
                  if [ "$AA" = "true" ]; then base="$CURRENT_SHA"; fi
                  baseline="$RUNNER_TEMP/benchmark-baseline"
                  current="$RUNNER_TEMP/benchmark-current"
                  mkdir -p "$baseline" "$current"
                  git archive "$base" | tar -x -C "$baseline"
                  git archive "$CURRENT_SHA" | tar -x -C "$current"
                  rustup target add wasm32-unknown-unknown
                  for dir in "$baseline" "$current"; do
                      # Commits from before the pnpm migration only have package-lock.json.
                      if [ -f "$dir/pnpm-lock.yaml" ]; then
                          pnpm install --frozen-lockfile --dir "$dir"
                      else
                          npm ci --prefix "$dir"
                      fi
                      # ml2drender-based checkouts render with the WASM built from their crates
                      if [ -f "$dir/Cargo.toml" ]; then
                          pnpm --dir "$dir" build:wasm
                      fi
                  done
                  echo "CHIITILER_BENCH_BASELINE=$baseline" >> "$GITHUB_ENV"
                  echo "CHIITILER_BENCH_CURRENT=$current" >> "$GITHUB_ENV"
                  echo "CHIITILER_BENCH_BASE_SHA=$base" >> "$GITHUB_ENV"
                  echo "CHIITILER_BENCH_CURRENT_SHA=$CURRENT_SHA" >> "$GITHUB_ENV"

            - name: Run paired benchmarks
              run: xvfb-run -a node --import tsx tests/run-benchmark-comparison.ts
              env:
                  # Balance both execution orders for quick PR feedback; manual runs retain more samples.
                  CHIITILER_BENCH_ROUNDS: ${{ github.event_name == 'pull_request' && '2' || '5' }}
                  CHIITILER_BENCH_DURATION: ${{ github.event_name == 'pull_request' && '5' || '10' }}
                  CHIITILER_BENCH_WARMUP: '3'

            - name: Post results to PR
              if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('benchmark-results/benchmark.md') != '' }}
              uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
              with:
                  header: benchmark
                  path: benchmark-results/benchmark.md
            - name: Upload benchmark results
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: benchmark-results
                  path: benchmark-results/
                  if-no-files-found: ignore
