name: test:benchmark

# Paired throughput comparison of the PR against its base (or of HEAD against main
# when run manually); see the header of tests/benchmark.ts. Reports only, never gates:
# shared runners are too noisy for a pass/fail threshold.

on:
    pull_request:
        branches:
            - main
        paths:
            - "src/**"
            - "tests/benchmark.ts"
            - "tests/fixtures/**"
            - "crs/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - ".github/workflows/test:benchmark.yml"
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    benchmark:
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # A baseline that fails to install is reported by the benchmark, which then
            # measures this checkout alone.
            - name: Check out the baseline
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
              run: |
                  git worktree add --detach "$RUNNER_TEMP/baseline" "$BASE_SHA"
                  pnpm install --frozen-lockfile --dir "$RUNNER_TEMP/baseline" || true
            - name: Run benchmark
              run: |
                  pnpm --silent test:benchmark "$RUNNER_TEMP/baseline" > benchmark.md
                  cat benchmark.md >> "$GITHUB_STEP_SUMMARY"
            - name: Post results to PR
              if: github.event_name == 'pull_request'
              uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
              with:
                  header: benchmark
                  path: benchmark.md
