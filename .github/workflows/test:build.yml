name: test:build

on:
    pull_request:
        branches:
            - main
        paths:
            - "src/**"
            - "crates/**"
            - "Cargo.lock"
            - "package.json"
            - "pnpm-lock.yaml"
            - "tsconfig.json"
            - ".github/workflows/test:build.yml"
    workflow_dispatch:

jobs:
    buildtest:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - name: Install deps
              run: pnpm install --frozen-lockfile
            # same build steps as the npm publish workflow (npm.yml),
            # so publish-time build failures are caught at PR time
            - name: Build with tsc
              run: pnpm exec tsc
            - name: Build the native renderer
              run: pnpm build:native
            - name: Bundle with esbuild
              run: pnpm build
