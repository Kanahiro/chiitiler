name: release

# Publishing a GitHub release (tag v<version>) checks the code, then publishes the npm package,
# the image and the API docs. A prerelease (a version with a `-`, e.g. 2.0.0-pre.1) goes to the
# `next` npm tag and image tag only: `latest` stays on the last release, and so do the docs.
# Running it by hand (workflow_dispatch) deploys only the docs, from the branch it runs on.
on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read

env:
    IMAGE: ghcr.io/kanahiro/chiitiler
    TAG: ${{ github.event.release.tag_name }}

jobs:
    check:
        runs-on: ubuntu-latest
        outputs:
            channel: ${{ steps.channel.outputs.channel }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: The tag is v<package.json version>
              if: github.event_name == 'release'
              run: |
                  version=$(node -p "require('./package.json').version")
                  if [ "$TAG" != "v$version" ]; then
                      echo "::error::tag $TAG does not match package.json version $version"
                      exit 1
                  fi
            - id: channel
              run: |
                  case "$TAG" in
                      "") echo channel=none ;;
                      *-*) echo channel=next ;;
                      *) echo channel=latest ;;
                  esac >> "$GITHUB_OUTPUT"
            - run: pnpm check
            - run: pnpm lint
            - run: pnpm test:unit --run

    npm:
        needs: check
        if: github.event_name == 'release'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # trusted publishing (and provenance)
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  registry-url: "https://registry.npmjs.org"
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec tsc
            - run: pnpm build # the chiitiler command (bin)
            - run: npm publish --tag ${{ needs.check.outputs.channel }}

    image:
        needs: check
        if: github.event_name == 'release'
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Build each platform natively; Node segfaults under QEMU emulation.
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Prepare
              run: |
                  platform=${{ matrix.platform }}
                  echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
            - name: Login GitHub Packages
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
                  cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
                  outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
            - name: Export digest
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"
            - name: Upload digest
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: digests-${{ env.PLATFORM_PAIR }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    image-manifest:
        needs: [check, image]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Download digests
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: true
            - name: Login GitHub Packages
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            # :<tag> always; :latest for releases, :next for prereleases
            - name: Create manifest list and push
              working-directory: /tmp/digests
              run: |
                  docker buildx imagetools create \
                    -t "$IMAGE:$TAG" -t "$IMAGE:${{ needs.check.outputs.channel }}" \
                    $(printf "$IMAGE@sha256:%s " *)
            - run: docker buildx imagetools inspect "$IMAGE:$TAG"

    docs:
        needs: check
        # the docs follow `latest`: not prereleases
        if: needs.check.outputs.channel != 'next'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        concurrency:
            group: pages
            cancel-in-progress: true
        environment:
            # its deployment rules must allow tags v* (by default they allow main only)
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
            - run: pnpm install --frozen-lockfile --ignore-scripts # native binaries are not needed for docs
            - run: pnpm run docs # `pnpm docs` is a pnpm built-in
            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: docs
            - id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
