[workspace]
members = ["crates/core", "crates/cli", "crates/wasm"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "BSD-3-Clause"

[workspace.dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

# WASM build (`pnpm build:wasm`): tuned for render speed (with simd128 from .cargo/config.toml).
# Measured fastest among opt-level s/z/2/3, thin/fat LTO and wasm-opt -O3/-O4 (wasm-opt was slower).
[profile.wasm]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
