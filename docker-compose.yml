services:
    app:
        build:
            context: ./
            target: dev
        depends_on:
            createbuckets:
                condition: service_completed_successfully
            fake-gcs-server:
                condition: service_started
        volumes:
            - ./src:/app/src
            - ./localdata:/app/localdata
            - ./crs:/app/crs
        ports:
            - 3000:3000
        command: pnpm dev
        environment:
            - CHIITILER_CACHE_METHOD=s3
            - CHIITILER_S3CACHE_BUCKET=chiitiler
            - CHIITILER_S3_REGION=us-east-1
            - CHIITILER_S3_ENDPOINT=http://rustfs:9000
            - CHIITILER_S3_FORCE_PATH_STYLE=true
            - CHIITILER_PROCESSES=0
            - CHIITILER_CRS_DIR=/app/crs
            - AWS_ACCESS_KEY_ID=rustfsadmin
            - AWS_SECRET_ACCESS_KEY=rustfsadmin
            - CHIITILER_GCS_API_ENDPOINT=http://fake-gcs-server:4443
    rustfs:
        image: rustfs/rustfs:1.0.6
        ports:
            - 9000:9000 # S3-compatible API
            - 9001:9001 # Web Console
        environment:
            - RUSTFS_ACCESS_KEY=rustfsadmin
            - RUSTFS_SECRET_KEY=rustfsadmin
    createbuckets:
        image: amazon/aws-cli:2.41.2
        depends_on:
            - rustfs
        entrypoint: >
            /bin/sh -ec "
            until aws --endpoint-url http://rustfs:9000 s3 ls > /dev/null 2>&1; do sleep 1; done;
            aws --endpoint-url http://rustfs:9000 s3 mb s3://chiitiler;
            aws --endpoint-url http://rustfs:9000 s3 mb s3://tiles;
            aws --endpoint-url http://rustfs:9000 s3 cp /initdata/tiles/ s3://tiles/ --recursive;
            aws --endpoint-url http://rustfs:9000 s3 cp /initdata/school.pmtiles s3://tiles/school.pmtiles;
            "
        environment:
            - AWS_ACCESS_KEY_ID=rustfsadmin
            - AWS_SECRET_ACCESS_KEY=rustfsadmin
            - AWS_DEFAULT_REGION=us-east-1
        volumes:
            - ./localdata:/initdata:ro
    fake-gcs-server:
        image: fsouza/fake-gcs-server:1.56.1
        ports:
            - "4443:4443"
        volumes:
            - ./localdata/tiles:/data/tiles:ro
        command: -scheme http
